name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...
      - name: go test
        run: go test ./...
      - name: go build
        run: go build -o orgshift ./cmd/orgshift
      - name: fixtures smoke test
        run: |
          ./orgshift fixtures --out /tmp/fx
          ./orgshift simulate --from /tmp/fx/larkspur-holdings.json --to /tmp/fx/fernhill-group.json --account 111111111115 --target-ou ou-fern-pay1 --format json --out /tmp/result.json || test $? -eq 3
          test -s /tmp/result.json
          ./orgshift simulate --from /tmp/fx/larkspur-holdings.json --to /tmp/fx/fernhill-group.json --ou ou-lark-work --target-ou ou-fern-bu --format json --out /tmp/ou-result.json || test $? -eq 3
          test -s /tmp/ou-result.json
          ./orgshift simulate --from /tmp/fx/fernhill-group.json --account 222222222225 --target-ou ou-fern-sand --format json --out /tmp/ct-result.json || test $? -eq 2
          grep -q '"id": "control-tower"' /tmp/ct-result.json
          grep -q '"id": "identity-center"' /tmp/result.json
          grep -q 'AWSReservedSSO_PaymentsEngineer_\*' /tmp/result.json
          ./orgshift simulate --from /tmp/fx/larkspur-holdings.json --to /tmp/fx/fernhill-group.json --account 111111111115 --target-ou ou-fern-pay1 --format runbook --out /tmp/runbook.md || test $? -eq 3
          grep -q '^## 3. The move' /tmp/runbook.md
          grep -q 'aws organizations move-account --account-id 111111111115 --source-parent-id r-fern --destination-parent-id ou-fern-pay1' /tmp/runbook.md
          # the transfer procedure: direct by default (invite, accept, no standalone interval), leave-and-rejoin only when asked for
          grep -q '"transfer_method": "direct"' /tmp/result.json
          grep -q '"version": "2026-11-05"' /tmp/result.json
          grep -q 'A source SCP denies organizations:LeaveOrganization, which blocks the transfer' /tmp/result.json
          grep -q 'The account lands at the destination root first' /tmp/result.json
          grep -q 'Transfer eligibility: 1 requirement(s) cannot be confirmed from the snapshots' /tmp/result.json
          grep -q 'Accept the invitation: the account changes organization' /tmp/runbook.md
          if grep -q 'aws organizations leave-organization' /tmp/runbook.md; then exit 1; fi
          ./orgshift simulate --from /tmp/fx/larkspur-holdings.json --to /tmp/fx/fernhill-group.json --account 111111111115 --target-ou ou-fern-pay1 --transfer-method leave-and-rejoin --format runbook --out /tmp/runbook-leave.md || test $? -eq 3
          grep -q 'aws organizations leave-organization' /tmp/runbook-leave.md
          grep -q 'Make the account able to stand alone' /tmp/runbook-leave.md
          if ./orgshift simulate --from /tmp/fx/larkspur-holdings.json --to /tmp/fx/fernhill-group.json --account 111111111115 --target-ou ou-fern-pay1 --transfer-method teleport > /dev/null 2>&1; then exit 1; fi
          # a complete snapshot gives GO on this move; the partially collected copy of the same organization must not
          ./orgshift simulate --from /tmp/fx/larkspur-holdings.json --account 111111111116 --target-ou ou-lark-prod --format json --out /tmp/go.json
          grep -q '"complete": true' /tmp/go.json
          ./orgshift simulate --from /tmp/fx/larkspur-holdings-partial.json --account 111111111116 --target-ou ou-lark-prod --format json --out /tmp/partial.json || test $? -eq 2
          grep -q '"id": "coverage"' /tmp/partial.json
          grep -q '"status": "access_denied"' /tmp/partial.json
          grep -q '"complete": false' /tmp/partial.json
          grep -q '"id": "rcp-applicability"' /tmp/partial.json
      - name: staged scenario smoke test
        run: |
          ./orgshift scenario example > /tmp/plan.yaml
          ./orgshift scenario check --scenario /tmp/plan.yaml
          ./orgshift stages --scenario /tmp/fx/scenario-payments-to-fernhill.yaml --format json --out /tmp/stages.json || test $? -eq 3
          grep -q '"stages_schema_version": 2' /tmp/stages.json
          grep -q '"id": "legacy"' /tmp/stages.json
          grep -q '"category": "declared-impact"' /tmp/stages.json
          grep -q '"source": "declared"' /tmp/stages.json
          grep -q 'invitation and is never standalone' /tmp/stages.json
          if grep -q 'Between leaving the source and accepting the invitation' /tmp/stages.json; then exit 1; fi
          ./orgshift stages --scenario /tmp/fx/scenario-fernhill-sandbox-staged.yaml --format markdown --out /tmp/stages.md || test $? -eq 3
          grep -q '^## Strategies compared' /tmp/stages.md
          ./orgshift simulate --from /tmp/fx/larkspur-holdings.json --to /tmp/fx/fernhill-group.json --account 111111111115 --target-ou ou-fern-pay1 --critical-operations /tmp/plan.yaml --format json --out /tmp/declared.json || test $? -eq 3
          grep -q '"declared_operations": 2' /tmp/declared.json
      - name: onboarding smoke test (offline)
        run: |
          ./orgshift config example > /tmp/orgshift.yaml
          ./orgshift config check --config /tmp/orgshift.yaml
          ./orgshift config check --config /tmp/orgshift.yaml --format json | grep -q '"schema_version": 1'
          ./orgshift iam-templates --out /tmp/iam
          test -s /tmp/iam/README.md && grep -q '"sts:AssumeRole"' /tmp/iam/org-management-permissions.json
          ./orgshift iam-templates --config /tmp/orgshift.yaml --out /tmp/iam-cfg
          grep -q 'arn:aws:iam::111111111111:role/PlatformOperators' /tmp/iam-cfg/org-management-trust.json
          # collect and preflight refuse to run without knowing which account the credentials must belong to; no AWS call is made
          if ./orgshift collect --profile nope --out /tmp/never.json; then exit 1; fi
          if ./orgshift preflight; then exit 1; fi
          test ! -e /tmp/never.json
      - name: workload layer smoke test (fixtures only)
        run: |
          ./orgshift workloads --snapshot /tmp/fx/larkspur-holdings.json | grep -q '3 account(s) with a workload inventory'
          ./orgshift workloads --snapshot /tmp/fx/larkspur-holdings.json --account 111111111115 --format json --out /tmp/workloads.json
          grep -q '"kind": "stackset-service-managed"' /tmp/workloads.json
          # the planted workload problems come out of the workloads check of the payments move
          grep -q '"result_schema_version": 4' /tmp/result.json
          grep -q '"id": "workloads"' /tmp/result.json
          grep -q '"evaluation": "evaluated"' /tmp/result.json
          grep -q "denies the account's own principals after the move" /tmp/result.json
          grep -q 'is deleted when the account leaves the organization' /tmp/result.json
          grep -q 'sits on 2 subnets shared through larkspur-core-network' /tmp/result.json
          grep -q '"source": "workload"' /tmp/result.json
          # the recreate strategy lists what must be redeployed, by provenance
          ./orgshift stages --scenario /tmp/fx/scenario-payments-recreate.yaml --format json --out /tmp/recreate.json || test $? -eq 2
          grep -q '"redeploy": {' /tmp/recreate.json
          grep -q 'Workload relocation: 8 stack(s)' /tmp/recreate.json
          # without an inventory the layer is not evaluated, and says so
          ./orgshift simulate --from /tmp/fx/larkspur-holdings-partial.json --to /tmp/fx/fernhill-group.json --account 111111111115 --target-ou ou-fern-pay1 --format json --out /tmp/noinv.json || test $? -eq 3
          grep -q '"evaluation": "not-evaluated"' /tmp/noinv.json
          # the billed S3 reads are not in the member role's default policy
          if grep -q 's3:' /tmp/iam/member-inspection-permissions.json; then exit 1; fi
          grep -q 's3:GetBucketPolicy' /tmp/iam/member-inspection-billable-opt-in.json
      - name: fuzz smoke test
        run: |
          go test ./internal/policy -run '^$' -fuzz FuzzParseAndApply -fuzztime 20s
          go test ./internal/policy -run '^$' -fuzz FuzzGlob -fuzztime 10s
          go test ./internal/evaluator -run '^$' -fuzz FuzzEvaluateWithPolicyDocument -fuzztime 20s
